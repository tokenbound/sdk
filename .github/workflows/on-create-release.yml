name: Publish to NPM

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: 'main' # Ensure we're on the main branch

      - name: Set up PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @tokenbound/ethers depends on @tokenbound/sdk, so the SDK builds first.
      - name: Build packages 🔧
        run: |
          pnpm --filter @tokenbound/sdk build
          pnpm --filter @tokenbound/ethers build

      - name: Validate published package contents
        run: node scripts/validate-package-contents.mjs

      - name: Publish @tokenbound/sdk 📦
        run: pnpm --filter @tokenbound/sdk publish --publish-branch main --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      - name: Publish @tokenbound/ethers 📦
        run: pnpm --filter @tokenbound/ethers publish --publish-branch main --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
